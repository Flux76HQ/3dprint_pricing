# 3D Print Pricing: app + PostgreSQL.
# Everything that differs per deployment comes from .env (copy .env.example, or run
# `python scripts/init_env.py`). The port is set once, in WEB_PORT.
#
# This file only pulls the published image, so a server needs nothing but this file
# and .env. To build from a checkout instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    # PRINTPRICING_TAG is chosen in .env next to this file: latest (stable, the default) or beta.
    # The same value goes into the container, so a beta build shows a beta label in the app.
    image: ghcr.io/flux76hq/3dprint_pricing:${PRINTPRICING_TAG:-latest}
    env_file: .env
    environment:
      PRINTPRICING_TAG: ${PRINTPRICING_TAG:-latest}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    volumes:
      - ${DATA_PATH}:/data   # DATA_PATH/uploads: the STL/3MF files (DATA_PATH/postgres is the database, below)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # The database is a folder on the host, never a Docker volume: it survives `docker compose down -v`, a rebuild and every update.
      # Use an absolute DATA_PATH (e.g. /data): a relative one is relative to wherever a tool runs this file from.
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
