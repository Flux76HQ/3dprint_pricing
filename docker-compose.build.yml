# Override: build the app image from this checkout instead of pulling it.
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# GIT_COMMIT is shown next to the version in the sidebar; without it the build says "dev".
services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
