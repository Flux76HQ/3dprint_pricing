name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, rather than jumping straight to a solution.
      placeholder: I print the same model in three colours and have to enter the calculation three times.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this should work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this? How do you work around it today?

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - Calculation (cost price)
        - Orders and invoices
        - Customers
        - Filament rolls and library
        - Printers and energy tariffs
        - Print files (STL / 3MF)
        - Sign-in
        - Back-up and restore
        - Notifications
        - AI product images
        - Settings
        - Something new
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Which platform is this for?
      multiple: true
      options:
        - Browser (desktop)
        - Browser (mobile)
        - Installed app (iPhone / iPad)
        - Installed app (Android)
        - All platforms
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have some day
        - Would clearly improve my use of the app
        - I run into this daily
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sketches, screenshots from other apps, links — anything that helps.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing requests for this feature
          required: true
