name: Regressie (Nederlands)
description: Iets wat werkte, is nu kapot
title: "[Regression]: "
labels: ["bug", "regression", "priority:high"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Wat werkt niet meer?
    validations:
      required: true

  - type: input
    id: last_good
    attributes:
      label: Laatste versie waarin het werkte
      placeholder: "0.26.18"
    validations:
      required: true

  - type: input
    id: first_bad
    attributes:
      label: Eerste versie waarin het stuk was
      placeholder: "0.26.19"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Stappen om het te reproduceren
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Browser (computer)
        - Browser (mobiel)
        - Geïnstalleerde app (iPhone / iPad)
        - Geïnstalleerde app (Android)
        - Backend / API
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Vermoedelijke commit of PR
      description: Als je hebt gebisect of een vermoeden hebt.
      placeholder: "#57 of a1b2c3d"

  - type: textarea
    id: logs
    attributes:
      label: Logboek of foutmeldingen
      render: shell
