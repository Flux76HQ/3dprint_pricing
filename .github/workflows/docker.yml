name: docker

# Publishes the stable image on every push to main (a promotion from beta; beta has its own workflow, docker-beta.yml). `latest` is a channel and moves on every build;
# `X.Y.Z` names one artifact, so it is only pushed when the git tag vX.Y.Z does not exist yet.
#
# This workflow also raises VERSION: pull requests do not touch it (two that did would conflict every time),
# so a push that changed code or build files gets the next number here, committed to main by the workflow,
# and the image is built from that commit. A push of documentation only keeps the number. The PR label
# `version:minor` / `version:major` chooses the part (patch otherwise). The bump commit is pushed with
# GITHUB_TOKEN and so starts no workflow of its own. The repository must let github-actions push to main
# (a ruleset bypass for it, if main is protected); without that the bump fails here, loudly, before anything is published.
on:
  push:
    branches:
      - main

# One run at a time: each one raises the number that the previous one left.
concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                      # the tip, not the pushed commit: an earlier run may have raised VERSION since
          fetch-depth: 0
      - name: Raise VERSION for this push
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          part=patch
          labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' 2>/dev/null || true)"
          if grep -qx 'version:major' <<<"$labels"; then part=major
          elif grep -qx 'version:minor' <<<"$labels"; then part=minor; fi
          python scripts/bump_version.py --before "${{ github.event.before }}" --after "$GITHUB_SHA" --part "$part"
          if ! git diff --quiet VERSION; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release $(tr -d '[:space:]' < VERSION)" VERSION homeassistant/config.yaml
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase origin main              # something landed meanwhile; VERSION is only ever changed here
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push the VERSION bump to main. Let github-actions push to main (ruleset bypass), or bump VERSION by hand."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read version and check the tag
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_COMMIT=${{ steps.bump.outputs.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.version.outputs.new == 'true' && format('{0}:{1}', steps.image.outputs.name, steps.version.outputs.version) || '' }}
      - name: Tag the release with notes
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" --target "${{ steps.bump.outputs.sha }}" \
            --title "v${{ steps.version.outputs.version }}" --generate-notes
      # beta is where pull requests land and main only receives promotions from it, so beta has to carry the VERSION bump
      # (and the release commit) main just made. Best effort: a failure here never undoes the release.
      - name: Bring beta level with main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin beta
          git checkout -B beta origin/beta
          if git merge --no-edit "${{ steps.bump.outputs.sha }}" && git push origin beta; then
            echo "beta is level with main."
          else
            git merge --abort 2>/dev/null || true
            echo "::warning::Could not bring beta level with main. Merge main into beta by hand (python scripts/update_branch.py on a branch off beta, with --base-ref origin/main)."
            exit 1
          fi
