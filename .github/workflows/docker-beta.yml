name: docker-beta

# Publishes the beta image on every push to beta: `beta` moves on every build, `beta-<sha>` names one build.
# It never writes a stable tag (`latest`, `X.Y.Z`) and never touches VERSION or the releases: main does that,
# after a promotion (see docker.yml).
on:
  push:
    branches:
      - beta

concurrency:
  group: publish-beta
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3             # to build the arm64 half of the image on this amd64 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64    # one tag, one manifest: Docker and the Home Assistant Supervisor pull the half that fits
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:beta
            ${{ steps.image.outputs.name }}:beta-${{ github.sha }}
