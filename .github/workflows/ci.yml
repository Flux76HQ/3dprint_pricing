name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # A skipped database test is a missing control, so fail if any test was skipped.
      - name: Run backend tests
        working-directory: backend
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -q -rs | tee /tmp/pytest.out
          ! grep -q "SKIPPED" /tmp/pytest.out

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every frontend module
        run: |
          for f in frontend/js/*.js frontend/sw.js; do node --check "$f" || exit 1; done
          node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest','utf8'))"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t printpricing:ci .
      - name: Compose files are valid for the example env
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
