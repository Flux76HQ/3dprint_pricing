name: ci

on:
  pull_request:
    branches:
      - beta
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # A skipped database test is a missing control, so fail if any test was skipped.
      - name: Run backend tests
        working-directory: backend
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest -q -rs | tee /tmp/pytest.out
          ! grep -q "SKIPPED" /tmp/pytest.out
      - name: Test the repository scripts
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every frontend module
        run: |
          # Checked as ES modules (a copy named .mjs): `node --check` on a .js file that uses import/export reports nothing, even for a broken one.
          for f in frontend/js/*.js frontend/sw.js; do
            cp "$f" "$RUNNER_TEMP/check.mjs"
            node --check "$RUNNER_TEMP/check.mjs" || { echo "Syntax error in $f"; exit 1; }
          done
          node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.webmanifest','utf8'))"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t printpricing:ci .
      - name: A Word invoice template can be turned into a PDF inside the image (as the unprivileged user)
        run: |
          docker run --rm --user 10001 --entrypoint python printpricing:ci -c \
            "from app import invoice_docs; pdf = invoice_docs.docx_to_pdf(invoice_docs.sample_docx()); assert pdf.startswith(b'%PDF'), pdf[:20]; print('pdf bytes:', len(pdf))"
      - name: The Home Assistant app builds on that image, starts its own PostgreSQL and the app, and stops cleanly
        run: |
          docker tag printpricing:ci ghcr.io/flux76hq/3dprint_pricing:ci
          docker build --build-arg BUILD_VERSION=ci -t printpricing-addon:ci homeassistant
          mkdir -p "$RUNNER_TEMP/addon-data"
          echo '{"rp_id": "localhost", "rp_origins": "http://localhost:6080", "proxy_hops": 0, "max_upload_mb": 50, "ai_images_enabled": false, "update_check": false}' > "$RUNNER_TEMP/addon-data/options.json"
          docker run -d --name addon -v "$RUNNER_TEMP/addon-data:/data" -p 6080:6080 printpricing-addon:ci
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:6080/readyz; then ready=1; break; fi
            sleep 2
          done
          docker logs addon
          [ "$ready" = 1 ] || { echo "::error::The Home Assistant app did not become ready."; exit 1; }
          docker stop -t 60 addon
          [ "$(docker inspect --format '{{.State.ExitCode}}' addon)" = 0 ] || { echo "::error::The Home Assistant app did not stop cleanly."; exit 1; }
      - name: Compose files are valid for the example env
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
