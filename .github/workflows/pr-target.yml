name: pr-target

# Pull requests go to beta. main only receives a pull request from beta (the promotion to a stable release).
# Make the `only-from-beta` check required in the branch protection of main.
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  only-from-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Require beta as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main only come from beta (this one comes from '$HEAD_REPO:$HEAD_REF'). Target beta instead."
            exit 1
          fi
